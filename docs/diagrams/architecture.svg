<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 572" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Better Agent Terminal architecture</title>
      <desc id="architecture-desc">Architecture of Better Agent Terminal: the React renderer invokes the Rust command router, which drives a Node sidecar for Claude, a Codex app-server and PTY shells; their output returns through the event hub to the renderer and is broadcast over a TLS WebSocket remote server whose clients dispatch requests back into the same router.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ── Zone: child processes ── -->
      <rect x="96" y="256" width="608" height="120" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="256" y="260" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="269" fill="#2d3142" fill-opacity="0.40" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CHILD PROCESSES</text>

      <!-- ── Arrows (drawn before nodes) ── -->

      <!-- UI → Router : invoke -->
      <line x1="400" y1="104" x2="400" y2="152" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Router → children (fan-out from bottom edge: 360 / 400 / 440) -->
      <path d="M 360,216 V 232 Q 360,240 352,240 H 208 Q 200,240 200,248 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="216" x2="400" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 440,216 V 232 Q 440,240 448,240 H 592 Q 600,240 600,248 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- children → Event Hub (fan-in to top edge: 360 / 400 / 440) -->
      <path d="M 200,352 V 384 Q 200,392 208,392 H 352 Q 360,392 360,400 V 416" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="400" y1="352" x2="400" y2="416" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 600,352 V 384 Q 600,392 592,392 H 448 Q 440,392 440,400 V 416" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Event Hub → UI : emit (return along the left side) -->
      <path d="M 320,448 H 72 Q 64,448 64,440 V 80 Q 64,72 72,72 H 240" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Event Hub → Remote Server : broadcast -->
      <path d="M 480,448 H 832 Q 840,448 840,440 V 352" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Remote Server → Router : dispatch -->
      <path d="M 800,288 V 192 Q 800,184 792,184 H 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Remote Clients ⇄ Remote Server : wss -->
      <line x1="840" y1="104" x2="840" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="880" y1="288" x2="880" y2="104" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

      <!-- ── Arrow labels ── -->
      <rect x="408" y="120" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="428" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INVOKE</text>

      <rect x="176" y="428" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="437" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMIT</text>

      <rect x="612" y="428" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="437" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROADCAST</text>

      <rect x="612" y="164" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="173" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

      <rect x="888" y="190" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="916" y="199" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WSS · TLS</text>

      <!-- ── Nodes ── -->

      <!-- React Renderer (input / UI) -->
      <rect x="240" y="40" width="320" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="40" width="320" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="248" y="46" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="262" y="55" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="400" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React Renderer</text>
      <text x="400" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WebView · xterm.js · host-api.ts</text>

      <!-- Remote Clients (external) -->
      <rect x="760" y="40" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="40" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="768" y="46" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="782" y="55" fill="#2d3142" fill-opacity="0.6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="840" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Remote Clients</text>
      <text x="840" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BAT · ssh tunnel</text>

      <!-- Command Router (focal) -->
      <rect x="320" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="152" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="328" y="158" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="342" y="167" fill="#eb6c36" fill-opacity="0.9" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUST</text>
      <text x="400" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Command Router</text>
      <text x="400" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commands/*.rs</text>

      <!-- Remote Server -->
      <rect x="760" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="768" y="294" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="782" y="303" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUST</text>
      <text x="840" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Remote Server</text>
      <text x="840" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tungstenite · rustls</text>

      <!-- Node Sidecar -->
      <rect x="120" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="128" y="294" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="142" y="303" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NODE</text>
      <text x="200" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node Sidecar</text>
      <text x="200" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-agent-sdk</text>

      <!-- Codex app-server -->
      <rect x="320" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="328" y="294" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="342" y="303" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROC</text>
      <text x="400" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Codex app-server</text>
      <text x="400" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JSON-RPC · JSONL</text>

      <!-- Shell (PTY) -->
      <rect x="520" y="288" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="288" width="160" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="528" y="294" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="542" y="303" fill="#4f5d75" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PTY</text>
      <text x="600" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shell Sessions</text>
      <text x="600" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">portable-pty · $SHELL</text>

      <!-- Event Hub (focal) -->
      <rect x="320" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="416" width="160" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="328" y="422" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="342" y="431" fill="#eb6c36" fill-opacity="0.9" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUST</text>
      <text x="400" y="450" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Event Hub</text>
      <text x="400" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">publish_runtime_event</text>

      <!-- ── Legend ── -->
      <line x1="40" y1="516" x2="940" y2="516" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="534" width="20" height="14" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="148" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HOST CORE</text>

      <rect x="240" y="534" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="268" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RUST MODULE</text>

      <rect x="368" y="534" width="20" height="14" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="396" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHILD PROCESS</text>

      <line x1="508" y1="541" x2="536" y2="541" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="544" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">REQUEST</text>

      <line x1="616" y1="541" x2="644" y2="541" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="652" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EVENT STREAM</text>

      <line x1="752" y1="541" x2="780" y2="541" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="788" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NETWORK</text>
    </svg>
